name: AmfetamineB
options:
  bundleIdPrefix: com.mak5er
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "5"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  AmfetamineB:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "*.ipa"
          - "*.py"
          - "*.md"
          - "*.sh"
          - "requirements.txt"
    dependencies:
      - framework: AirliftFFI.xcframework
        embed: false
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_NAME: "AmfetamineB"
        PRODUCT_BUNDLE_IDENTIFIER: com.mak5er.amfetamineb
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Amfeta-Spoit-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: Amfeta-Spoit.entitlements
        OTHER_LDFLAGS: "-lc++ -framework NetworkExtension"
        GENERATE_INFOPLIST_FILE: NO
